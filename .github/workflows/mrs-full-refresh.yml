name: MRS Full Refresh

# Runs the complete MRS pipeline on GitHub's infrastructure (unrestricted
# FRED access). Commits monitoring CSVs, dashboard JSON, commentary, and
# manifest to main; the existing deploy-pages.yml deploys from there.
#
# Triggers:
#   - Daily at 06:30 UTC (catches NFP ~1st Fri, IP ~16th, PCE ~27th)
#   - Manual via workflow_dispatch (for on-demand runs or catch-up)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Run MRS full pipeline
        id: pipeline
        run: python src/mrs_gha_runner.py
        # exit 0 = new month published, exit 2 = no new data (no-op), exit 1 = error

      - name: Check for real changes
        id: diff
        if: steps.pipeline.outcome == 'success' && steps.pipeline.outputs.exit_code != '2'
        run: |
          # Exclude pure timestamp-only diffs in metadata.json
          REAL=$(git diff --name-only -- \
            'outputs/monitoring/' \
            'dashboard/data/composite_history.json' \
            'dashboard/data/pillars_wide.json' \
            'dashboard/data/pillars_long.json' \
            'dashboard/data/indicators_wide.json' \
            'dashboard/data/indicators_long.json' \
            'dashboard/data/regime_periods.json' \
            'dashboard/data/active_flags.json' \
            'dashboard/data/commentary.json' \
            'config/refresh_manifest.json' | wc -l)
          echo "real_changes=$REAL" >> "$GITHUB_OUTPUT"
          echo "Changed files (non-timestamp): $REAL"

      - name: Commit and push
        if: >
          steps.pipeline.outcome == 'success' &&
          steps.diff.outputs.real_changes != '0' &&
          steps.diff.outputs.real_changes != ''
        run: |
          git config user.name  "MRS Agent"
          git config user.email "mrs-agent@users.noreply.github.com"

          DATA_THROUGH=$(python3 -c "
          import json
          m = json.load(open('dashboard/data/metadata.json'))
          print(m['data_through'][:7])
          ")
          REGIME=$(python3 -c "
          import json
          m = json.load(open('dashboard/data/metadata.json'))
          print(m['latest_regime_confirmed'])
          ")
          COMP_Z=$(python3 -c "
          import json
          m = json.load(open('dashboard/data/metadata.json'))
          z = float(m['latest_composite_z'])
          print(f'{z:+.3f}')
          ")

          git add \
            outputs/monitoring/ \
            dashboard/data/ \
            config/refresh_manifest.json

          git diff --staged --quiet || git commit -m \
            "MRS update: ${DATA_THROUGH} (Regime: ${REGIME}, z ${COMP_Z})"

          # Pull with rebase in case main advanced while the pipeline ran
          git pull --rebase origin main
          git push origin main

      - name: No-op summary
        if: steps.pipeline.outcome == 'success' && steps.diff.outputs.real_changes == '0'
        run: echo "Pipeline ran — no real data changes (timestamp-only diff or no new month). Nothing committed."

      - name: Pipeline error summary
        if: steps.pipeline.outcome != 'success'
        run: |
          echo "::error::MRS pipeline failed — check logs above."
          exit 1
