name: MRS Full Refresh

# Runs the complete MRS pipeline on GitHub's infrastructure (unrestricted
# FRED access). Commits monitoring CSVs, dashboard JSON, commentary, and
# manifest to main; the existing deploy-pages.yml deploys from there.
#
# Exit codes from mrs_gha_runner.py:
#   0  — new month published (commit + push)
#   2  — no new data (no-op, expected on most days)
#   1  — pipeline error (fail the job so GitHub notifies)
#
# Triggers:
#   - Daily at 06:30 UTC (catches NFP ~1st Fri, IP ~16th, PCE ~27th)
#   - Manual via workflow_dispatch (for on-demand or catch-up runs)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Run MRS full pipeline
        id: pipeline
        shell: bash
        run: |
          set +e
          python src/mrs_gha_runner.py
          EXIT=$?
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          if [ "$EXIT" -eq 2 ]; then
            echo "result=noop" >> "$GITHUB_OUTPUT"
            echo "No new month available yet — pipeline ran clean, nothing to publish."
            exit 0          # treat no-op as success so the job is green
          elif [ "$EXIT" -ne 0 ]; then
            echo "result=error" >> "$GITHUB_OUTPUT"
            echo "::error::MRS pipeline failed with exit code $EXIT"
            exit "$EXIT"
          else
            echo "result=new_month" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for real changes
        id: diff
        if: steps.pipeline.outputs.result == 'new_month'
        run: |
          REAL=$(git diff --name-only -- \
            'outputs/monitoring/' \
            'dashboard/data/composite_history.json' \
            'dashboard/data/pillars_wide.json' \
            'dashboard/data/pillars_long.json' \
            'dashboard/data/indicators_wide.json' \
            'dashboard/data/indicators_long.json' \
            'dashboard/data/regime_periods.json' \
            'dashboard/data/active_flags.json' \
            'dashboard/data/commentary.json' \
            'config/refresh_manifest.json' | wc -l)
          echo "real_changes=$REAL" >> "$GITHUB_OUTPUT"
          echo "Non-timestamp changed files: $REAL"

      - name: Commit and push
        if: >
          steps.pipeline.outputs.result == 'new_month' &&
          steps.diff.outputs.real_changes != '0' &&
          steps.diff.outputs.real_changes != ''
        run: |
          git config user.name  "MRS Agent"
          git config user.email "mrs-agent@users.noreply.github.com"

          DATA_THROUGH=$(python3 -c "
          import json; m=json.load(open('dashboard/data/metadata.json'))
          print(m['data_through'][:7])")
          REGIME=$(python3 -c "
          import json; m=json.load(open('dashboard/data/metadata.json'))
          print(m['latest_regime_confirmed'])")
          COMP_Z=$(python3 -c "
          import json; m=json.load(open('dashboard/data/metadata.json'))
          print(f\"{float(m['latest_composite_z']):+.3f}\")")

          git add \
            outputs/monitoring/ \
            dashboard/data/ \
            config/refresh_manifest.json

          git diff --staged --quiet || git commit -m \
            "MRS update: ${DATA_THROUGH} (Regime: ${REGIME}, z ${COMP_Z})"

          git pull --rebase origin main
          git push origin main

      - name: No-op summary
        if: steps.pipeline.outputs.result == 'noop'
        run: echo "No new month available on FRED yet — will retry tomorrow at 06:30 UTC."
