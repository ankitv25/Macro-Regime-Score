name: MRS Full Refresh

# Runs the complete MRS pipeline on GitHub's infrastructure (unrestricted
# FRED access). Commits monitoring CSVs, dashboard JSON, commentary, and
# manifest to main; the existing deploy-pages.yml deploys from there.
#
# Exit codes from mrs_gha_runner.py:
#   0  — pipeline ran OK (new month OR resync with revisions); workflow checks git diff
#   1  — pipeline error (fail the job)
#
# result output:
#   new_month  — data_through advanced; note + manifest were written
#   resync     — same month but may contain FRED revisions / market updates
#
# Triggers:
#   - Daily at 06:30 UTC (catches NFP ~1st Fri, IP ~16th, PCE ~27th)
#   - Manual via workflow_dispatch (for on-demand or catch-up runs)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Run MRS full pipeline
        id: pipeline
        run: python src/mrs_gha_runner.py
        # exit 0 = success (new month or resync), exit 1 = error

      - name: Check for real changes
        id: diff
        if: steps.pipeline.outcome == 'success'
        run: |
          # Count changed files that carry real data (not just the generated_at timestamp)
          REAL=$(git diff --name-only -- \
            'outputs/monitoring/' \
            'dashboard/data/composite_history.json' \
            'dashboard/data/pillars_wide.json' \
            'dashboard/data/pillars_long.json' \
            'dashboard/data/indicators_wide.json' \
            'dashboard/data/indicators_long.json' \
            'dashboard/data/regime_periods.json' \
            'dashboard/data/active_flags.json' \
            'dashboard/data/commentary.json' \
            'config/refresh_manifest.json' | wc -l)
          echo "real_changes=$REAL" >> "$GITHUB_OUTPUT"
          echo "Non-timestamp changed files: $REAL"

          # Also check metadata separately to detect pure timestamp-only diff
          META_ONLY=$(git diff -- 'dashboard/data/metadata.json' | \
            grep '^[+-]' | grep -v '^[+-][+-][+-]' | \
            grep -v 'generated_at' | wc -l)
          echo "metadata_data_lines_changed=$META_ONLY" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: >
          steps.pipeline.outcome == 'success' &&
          steps.diff.outputs.real_changes != '0' &&
          steps.diff.outputs.real_changes != ''
        run: |
          git config user.name  "MRS Agent"
          git config user.email "mrs-agent@users.noreply.github.com"

          DATA_THROUGH=$(python3 -c "
          import json; m=json.load(open('dashboard/data/metadata.json'))
          print(m['data_through'][:7])")
          REGIME=$(python3 -c "
          import json; m=json.load(open('dashboard/data/metadata.json'))
          print(m['latest_regime_confirmed'])")
          COMP_Z=$(python3 -c "
          import json; m=json.load(open('dashboard/data/metadata.json'))
          print(f\"{float(m['latest_composite_z']):+.3f}\")")

          RESULT="${{ steps.pipeline.outputs.result }}"
          if [ "$RESULT" = "new_month" ]; then
            MSG="MRS update: ${DATA_THROUGH} (Regime: ${REGIME}, z ${COMP_Z})"
          else
            MSG="MRS resync: ${DATA_THROUGH} — FRED revisions + market data update"
          fi

          git add \
            outputs/monitoring/ \
            dashboard/data/ \
            config/refresh_manifest.json

          git diff --staged --quiet || git commit -m "$MSG"

          git pull --rebase --autostash origin main
          git push origin main

      - name: No-op summary
        if: >
          steps.pipeline.outcome == 'success' &&
          (steps.diff.outputs.real_changes == '0' || steps.diff.outputs.real_changes == '')
        run: echo "Pipeline ran clean — no real data changes vs committed state. Nothing to publish."
